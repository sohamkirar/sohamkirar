
name: Generate Arctic Blue Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: sohamkirar
          outputs: |
            dist/github-snake.svg?color_snake=%2363D8FF&color_dots=%23081629,%23123B63,%231D78B8,%23477BFF,%2363D8FF
            dist/github-snake-dark.svg?color_snake=%2363D8FF&color_dots=%23081629,%23123B63,%231D78B8,%23477BFF,%2363D8FF

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
